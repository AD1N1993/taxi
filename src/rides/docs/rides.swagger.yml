tags:
  - name: Rides
    description: API for managing rides

paths:
  /api/rides:
    get:
      summary: Get a list of all rides
      tags: [Rides]
      security:
        - BasicAuth: []
      responses:
        200:
          description: List of all rides (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideListResponse'
    post:
      summary: Create a new ride for an existing driver
      tags: [Rides]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreateRequest'
      responses:
        201:
          description: Ride successfully created for an existing driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'
        400:
          description: Validation error or the driver does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthorized

  /api/rides/{id}:
    get:
      summary: Get a ride by ID
      tags: [Rides]
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        200:
          description: The requested ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'
        400:
          description: Invalid ObjectId format
        404:
          description: Ride not found

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

  parameters:
    RideId:
      in: path
      name: id
      required: true
      description: MongoDB ObjectId of the ride
      schema:
        type: string
        example: '66efeb12eb3dafea3c3971fc'

  schemas:
    RideAttributes:
      type: object
      properties:
        clientName:
          type: string
          example: 'Alice Johnson'
        driverId:
          type: string
          description: MongoDB ObjectId of an existing driver
          example: '66efeaadeb3dafea3c3971fb'
        driverName:
          type: string
          example: 'Tom Rider'
        vehicleLicensePlate:
          type: string
          example: 'XYZ-1234'
        vehicleName:
          type: string
          example: 'Toyota Camry'
        price:
          type: number
          format: float
          example: 15.75
        currency:
          type: string
          enum: [usd, eur]
          example: 'usd'
        addresses:
          type: object
          properties:
            from:
              type: string
              example: '123 Main St, Cityville'
            to:
              type: string
              example: '456 Elm St, Townsville'

    RideResource:
      type: object
      properties:
        type:
          type: string
          enum: [rides]
          example: 'rides'
        id:
          type: string
          description: MongoDB ObjectId of the ride
          example: '66efeb12eb3dafea3c3971fc'
        attributes:
          $ref: '#/components/schemas/RideAttributes'

    RideResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RideResource'

    RideListResponse:
      type: object
      properties:
        meta:
          type: object
        data:
          type: array
          items:
            $ref: '#/components/schemas/RideResource'

    RideCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum: [rides]
              example: 'rides'
            attributes:
              type: object
              required:
                - clientName
                - price
                - currency
                - driverId
                - fromAddress
                - toAddress
              properties:
                clientName:
                  type: string
                  description: '3-100 chars'
                  example: 'Alice Johnson'
                price:
                  type: number
                  format: float
                  description: 'Must be greater than 0'
                  example: 15.75
                currency:
                  type: string
                  enum: [usd, eur]
                  example: 'usd'
                driverId:
                  type: string
                  description: MongoDB ObjectId of an existing driver
                  example: '66efeaadeb3dafea3c3971fb'
                fromAddress:
                  type: string
                  description: '10-200 chars'
                  example: '123 Main St, Cityville'
                toAddress:
                  type: string
                  description: '10-200 chars'
                  example: '456 Elm St, Townsville'

    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: 'clientName'
        message:
          type: string
          example: 'Length of clientName is not correct'

    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
