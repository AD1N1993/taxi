tags:
  - name: Drivers
    description: API for managing drivers

paths:
  /api/drivers:
    get:
      summary: Get a list of all drivers
      tags: [Drivers]
      security:
        - BasicAuth: []
      responses:
        200:
          description: List of all drivers (JSON:API)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListResponse'
    post:
      summary: Add a new driver
      tags: [Drivers]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
      responses:
        201:
          description: The driver was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        401:
          description: Unauthorized

  /api/drivers/{id}:
    get:
      summary: Get a driver by ID
      tags: [Drivers]
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        200:
          description: The requested driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        400:
          description: Invalid ObjectId format
        404:
          description: Driver not found
    put:
      summary: Update a driver by ID
      tags: [Drivers]
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        204:
          description: Driver updated successfully
        400:
          description: Validation error (including data.id/URL id mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        404:
          description: Driver not found
    delete:
      summary: Delete a driver by ID
      tags: [Drivers]
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        204:
          description: Driver deleted successfully
        404:
          description: Driver not found

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

  parameters:
    DriverId:
      in: path
      name: id
      required: true
      description: MongoDB ObjectId of the driver
      schema:
        type: string
        example: '66efeaadeb3dafea3c3971fb'

  schemas:
    DriverAttributes:
      type: object
      required:
        - name
        - phoneNumber
        - email
        - vehicleMake
        - vehicleModel
        - vehicleYear
        - vehicleLicensePlate
        - vehicleFeatures
      properties:
        name:
          type: string
          description: 'Full name of the driver (2-15 chars)'
          example: 'Tom Rider'
        phoneNumber:
          type: string
          description: "Driver's phone number (8-15 chars)"
          example: '123-456-7890'
        email:
          type: string
          format: email
          description: "Driver's email address (5-100 chars)"
          example: 'tom.rider@example.com'
        vehicleMake:
          type: string
          description: 'Make of the vehicle (3-100 chars)'
          example: 'Toyota'
        vehicleModel:
          type: string
          description: 'Model of the vehicle (2-100 chars)'
          example: 'Camry'
        vehicleYear:
          type: integer
          description: 'Year the vehicle was manufactured (1980 - current year)'
          example: 2020
        vehicleLicensePlate:
          type: string
          description: "Vehicle's license plate number (6-10 chars)"
          example: 'XYZ-1234'
        vehicleDescription:
          type: string
          nullable: true
          description: 'Optional description of the vehicle (10-200 chars if provided)'
          example: 'A spacious SUV with leather seats and a sunroof.'
        vehicleFeatures:
          type: array
          items:
            type: string
            enum: [wi-fi, child-seat, pet-friendly]
          description: 'Features available in the vehicle'
          example: ['wi-fi', 'pet-friendly']

    DriverResource:
      type: object
      properties:
        type:
          type: string
          enum: [drivers]
          example: 'drivers'
        id:
          type: string
          description: MongoDB ObjectId of the driver
          example: '66efeaadeb3dafea3c3971fb'
        attributes:
          $ref: '#/components/schemas/DriverAttributes'

    DriverResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DriverResource'

    DriverListResponse:
      type: object
      properties:
        meta:
          type: object
        data:
          type: array
          items:
            $ref: '#/components/schemas/DriverResource'

    DriverCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum: [drivers]
              example: 'drivers'
            attributes:
              $ref: '#/components/schemas/DriverAttributes'

    DriverUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - id
            - attributes
          properties:
            type:
              type: string
              enum: [drivers]
              example: 'drivers'
            id:
              type: string
              description: 'Must match the :id in the URL'
              example: '66efeaadeb3dafea3c3971fb'
            attributes:
              $ref: '#/components/schemas/DriverAttributes'

    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: 'name'
        message:
          type: string
          example: 'Length of name is not correct'

    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
